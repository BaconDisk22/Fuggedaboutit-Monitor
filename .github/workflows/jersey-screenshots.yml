name: Jersey Demo Screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'public/demo.html'
      - 'README.md'
      - 'scripts/capture-jersey-demo.mjs'
      - '.github/workflows/jersey-screenshots.yml'
  push:
    branches: [main]
    paths:
      - 'public/demo.html'
      - 'scripts/capture-jersey-demo.mjs'
      - '.github/workflows/jersey-screenshots.yml'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install browser for screenshots
        run: npx puppeteer browsers install chrome
      - name: Start isolated demo web server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 --directory public > /tmp/jersey-demo.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/demo.html -o /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/jersey-demo.log
          exit 1
      - name: Generate desktop and mobile screenshots
        run: node scripts/capture-jersey-demo.mjs
      - name: Publish screenshots to repository for README
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p docs/screenshots
          cp screenshots/jersey-demo-*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh Jersey demo screenshots [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload screenshot gallery
        uses: actions/upload-artifact@v4
        with:
          name: jersey-demo-screenshots
          path: screenshots/*.png
          if-no-files-found: error
          retention-days: 30
